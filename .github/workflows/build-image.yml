name: Build Wan train image to GHCR

# workflow_dispatch ONLY. Publishes ghcr.io/skyphusion-labs/vivijure-wan-train:train-<version>
# (successor to vivijure-backend:train-*).
#
# DISABLED 2026-09-25, FAILS CLOSED. This bake cannot run on any runner we still have.
#
# WHAT IT NEEDED: a builder with several hundred GB of scratch disk. The job stages the Wan
# weights into HF_HOME and asserts at least 55 GB landed (`bake_layers.py assert-weights
# --min-gb 55`), bin-packs that same 55 GB into 12 layer bins under a 9.6 GB ceiling (so both
# copies are on disk at once before the `rm -rf`), then builds an image containing them with
# `load: true`, which materialises another full copy in the local docker image store. Peak is
# comfortably past 200 GB.
#
# WHY IT IS OFF: it ran on Plane C `[self-hosted, bake-capable]`, which was the Hetzner fleet.
# The fleet was decommissioned 2026-09-24 (cost) and the label now matches no runner. A dead
# label does NOT fail a job, it QUEUES it, indefinitely and with no error anywhere, which is
# the worst available failure mode: a dispatch just hangs as a pending check. GitHub-hosted
# `ubuntu-latest` is the only live CI plane and it has roughly 14 GB free, or roughly 70 GB
# after an aggressive reclaim. That is not within an order of magnitude of what this needs, so
# repointing the label would only trade a silent hang for a confusing out-of-disk failure deep
# in a weights download.
#
# The `runs-on` is set to `ubuntu-latest` so this file no longer carries a dead label, and the
# job fails closed on its first step instead. The full build recipe below is left intact and
# unmodified: re-enabling is deleting the `Disabled` step and pointing `runs-on` at a builder
# that has the disk. It is NOT a rewrite.
#
# This is a capability gap, not a defect to route around. A builder with the disk is a spend
# and topology decision, and it is Conrad's.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version -> train-<version> tag (SemVer-ish).'
        required: true
        default: '0.1.0'
        type: string
      aitoolkit_ref:
        description: 'ai-toolkit commit pin (40-char hex).'
        required: true
        default: '6e158dd1f1552b73b7aca6d7ddaa46a783538052'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: wan-train-image-build-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: skyphusion-labs
  IMAGE: vivijure-wan-train

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Fail closed. See the DISABLED note in the header: this bake needs 200+ GB of scratch
      # disk and the pool that had it is gone. Delete this step to re-enable, and point
      # `runs-on` at a builder with the disk.
      - name: Disabled -- no builder with the required disk
        run: |
          echo "::error::vivijure-wan-train image bake is DISABLED (2026-09-25). It needs 200+ GB of scratch disk (55 GB of Wan weights, staged, then bin-packed, then loaded into the local docker store). It ran on Plane C [self-hosted, bake-capable]; that fleet was decommissioned 2026-09-24. ubuntu-latest has ~14 GB free (~70 GB after reclaim) and cannot host this build. Failing closed rather than queueing forever on a dead label."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main"
            exit 1
          fi

      - name: Resolve config
        id: cfg
        env:
          VER: ${{ github.event.inputs.version }}
          REF: ${{ github.event.inputs.aitoolkit_ref }}
        run: |
          set -eu
          case "${VER}" in ''|*[!0-9.]*) echo "::error::version must be digits + dots"; exit 1;; esac
          [ "${#REF}" -eq 40 ] || { echo "::error::aitoolkit_ref must be 40-char hex"; exit 1; }
          echo "tag=train-${VER}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=train-${VER}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "aitoolkit_ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Stage + bin-pack Wan train weights
        env:
          HF_HOME: ${{ github.workspace }}/_wanbase
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          python3 -m venv /tmp/hfdl
          /tmp/hfdl/bin/pip install --quiet huggingface_hub
          HF_HOME="${HF_HOME}" HF_TOKEN="${HF_TOKEN}" /tmp/hfdl/bin/python scripts/download_wan_weights.py
          python3 deploy/bake_layers.py assert-weights --root "${HF_HOME}" --min-gb 55
          python3 deploy/bake_layers.py bin --src "${HF_HOME}" --out deploy/train-bins --bins 12 --ceiling-gb 9.6 --min-gb 55
          python3 deploy/bake_layers.py manifest --bins-root deploy/train-bins --out deploy/train-bins/weights-manifest.sha256
          rm -rf "${HF_HOME}"

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          pull: false
          load: true
          push: false
          build-args: |
            AITOOLKIT_REF=${{ steps.cfg.outputs.aitoolkit_ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:${{ steps.cfg.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:${{ steps.cfg.outputs.immutable_tag }}

      - name: Verify layers under 10GB GHCR ceiling
        run: |
          IMG="${REGISTRY}/${OWNER}/${IMAGE}:${{ steps.cfg.outputs.tag }}"
          python3 deploy/bake_layers.py verify-image --image "${IMG}" --ceiling-gb 10.0

      - name: Import smoke (both envs, CPU)
        run: |
          IMG="${REGISTRY}/${OWNER}/${IMAGE}:${{ steps.cfg.outputs.tag }}"
          docker run --rm "${IMG}" conda run --no-capture-output -n vivijure \
            python -c "from wan_train import wan_lora_train as W; assert W.aitoolkit_python().endswith('/aitoolkit/bin/python')"
          docker run --rm "${IMG}" conda run --no-capture-output -n aitoolkit \
            python -c "import torch, diffusers, transformers"

      - name: Push tags
        id: push
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${IMAGE}"
          docker push "${IMG}:${{ steps.cfg.outputs.tag }}"
          docker push "${IMG}:${{ steps.cfg.outputs.immutable_tag }}"
          DIGEST="$(docker inspect --format '{{ index .RepoDigests 0 }}' "${IMG}:${{ steps.cfg.outputs.tag }}" | sed 's/.*@//')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Wan train image published" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin CF prod train EP to \`${REGISTRY}/${OWNER}/${IMAGE}:${{ steps.cfg.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
