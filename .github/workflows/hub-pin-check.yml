name: hub pin check

# The RunPod Hub listing builds .runpod/Dockerfile, a thin FROM of the published GHCR image.
# This gate fails the build when that pin is stale, unpinned, or no longer anonymously pullable
# (which is exactly the reach the Hub builder has). Public repo -> GitHub-hosted runner.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hub-pin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify .runpod/Dockerfile base pin resolves on GHCR
        run: bash scripts/check_hub_base_pin.sh .runpod/Dockerfile
